name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run (RELEASE.md, step 1): every build and package job and the
  # release files, from the branch it is started on, and nothing published.
  # Started this way the version checks print instead of failing, since a
  # branch build is a -dev build
  workflow_dispatch:

# The workflow's own token can only read. A job that writes says so in its own
# permissions (create-release, the publish jobs, update-apt,
# commit-package-files); the jobs that
# push to other repositories or file elsewhere use their own tokens
# (HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN, WINGET_TOKEN, NIXPKGS_FORK_TOKEN,
# FREEBSD_BUGZILLA_API_KEY)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link musl statically, so the binaries don't depend on the
          # runner's glibc version and also run on older distributions and on Alpine
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: proc-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: proc-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: proc-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: proc-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: proc-windows-x86_64.exe
          # FreeBSD and NetBSD build in their own VMs (build-bsd below)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      # The toolchain follows stable (the oldest supported Rust is tested in
      # RELEASE.md's checks); the log records the one each binary was built with
      - name: Record the Rust version
        run: rustc --version && cargo --version

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # proc.exe links the C runtime statically (.cargo/config.toml), so it runs
      # without the Visual C++ Redistributable. The runners have that runtime
      # installed, so a missing DLL never shows in a run: read the import table.
      - name: Check proc.exe needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents "target/${{ matrix.target }}/release/proc.exe"
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') {
            echo "::error::proc.exe imports the Visual C++ runtime; it must link it statically"
            exit 1
          }

      # Every publish job needs this one, so a binary that would call itself a
      # -dev build, or a tag that doesn't match Cargo.toml's version, stops the
      # release here. Cross-compiled targets can't run on the runner, so they
      # only get the marker check.
      - name: Check the binary reports the tag's version
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/proc${{ runner.os == 'Windows' && '.exe' || '' }}
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "dry run: $("$bin" --version 2>/dev/null | head -1 | tr -d '\r' || echo "$bin can't run here")"
            exit 0
          fi
          if LC_ALL=C grep -a -q -- '-dev (' "$bin"; then
            echo "::error::$bin is labelled as a dev build; the tag must be v<Cargo.toml version>"
            exit 1
          fi
          if [ "${{ matrix.target }}" != aarch64-unknown-linux-musl ] && [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
            got=$("$bin" --version | head -1 | tr -d '\r')
            want="proc ${GITHUB_REF_NAME#v}"
            if [ "$got" != "$want" ]; then
              echo "::error::$bin --version printed '$got', expected '$want'"
              exit 1
            fi
            echo "$got"
          fi

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/proc ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/proc.exe" -Destination "${{ matrix.artifact }}"

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: warn

  # .deb and .rpm files for the GitHub Release (not an apt or dnf repository, so
  # they don't update themselves). nfpm packs the static musl binaries; the man
  # page and completions come from running the x86_64 binary on this runner.
  package-linux:
    name: Package .deb and .rpm
    needs: build-release
    runs-on: ubuntu-latest
    env:
      # Pinned release; the checksum is the one in that release's checksums.txt
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proc-linux-*
          merge-multiple: true
          path: linux

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate the man page and completions
        run: |
          chmod +x linux/proc-linux-x86_64 linux/proc-linux-aarch64
          pkg/nfpm/generate-docs.sh linux/proc-linux-x86_64 docs-out

      - name: Build the packages
        run: |
          # A dry run has no tag: the version comes from Cargo.toml
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          pkg/nfpm/build.sh "$VERSION" amd64 linux/proc-linux-x86_64 docs-out packages
          pkg/nfpm/build.sh "$VERSION" arm64 linux/proc-linux-aarch64 docs-out packages
          ls -la packages
          test "$(find packages -type f | wc -l)" -eq 4

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: packages/*
          if-no-files-found: error

  # The PyPI wheels: one per release binary, repacked, not rebuilt
  # (pkg/pypi/build-wheels.py), so pip installs the very binaries build-release
  # checked. They are not release files: create-release leaves them out
  package-pypi:
    name: Package the PyPI wheels
    needs: build-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proc-linux-*
          merge-multiple: true
          path: binaries

      - name: Download the macOS binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proc-darwin-*
          merge-multiple: true
          path: binaries

      - name: Download the Windows binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proc-windows-*
          merge-multiple: true
          path: binaries

      - name: Get the version
        id: version
        run: |
          # A dry run has no tag: the version comes from Cargo.toml
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 pkg/pypi/build-wheels.py "$VERSION" dist binaries
          ls -la dist
          test "$(find dist -type f | wc -l)" -eq 5

      # Checks the metadata and the README PyPI will render
      - name: Check the wheels' metadata
        run: pipx run twine check dist/*

      - name: Upload the wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels
          path: dist/*
          if-no-files-found: error

  # Each wheel is installed with pip, from the files, on the OS it is for, and
  # its proc must run and name the version. There is no TestPyPI run: its
  # proc-cli belongs to an unrelated project. The musl wheel runs in Alpine
  test-pypi:
    name: Install the PyPI wheel (${{ matrix.name }})
    needs: package-pypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: Alpine x86_64
            os: ubuntu-latest
            image: python:3-alpine
          - name: macOS arm64
            os: macos-latest
          - name: macOS x86_64
            os: macos-15-intel
          - name: Windows x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: wheels

      - name: Install the wheel and run proc
        if: matrix.image == ''
        shell: bash
        env:
          VERSION: ${{ needs.package-pypi.outputs.version }}
        run: pkg/pypi/test-install.sh "$VERSION" wheels "$GITHUB_EVENT_NAME"

      - name: Install the wheel and run proc (Alpine)
        if: matrix.image != ''
        env:
          VERSION: ${{ needs.package-pypi.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE" \
            sh pkg/pypi/test-install.sh "$VERSION" wheels "$GITHUB_EVENT_NAME"

  # FreeBSD and NetBSD build natively in their own VMs (scripts/bsd-build.sh:
  # cross's images lack libraries proc links). Each binary must print the
  # tag's version and read the port table there before anything is published.
  # The target directory stays outside the workspace, which is copied back
  build-bsd:
    name: Build ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [freebsd, netbsd]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          cpu: 4
          mem: 8192
          prepare: pkg install -y rust
          run: |
            cd "$GITHUB_WORKSPACE"
            export CARGO_TARGET_DIR="$HOME/proc-target"
            rustc --version
            # a dry run expects no version (GITHUB_* reach the VM)
            want=""; [ "$GITHUB_EVENT_NAME" = push ] && want="proc ${GITHUB_REF_NAME#v}"
            sh scripts/bsd-build.sh proc-freebsd-x86_64 "$want"

      - name: Build on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          release: "11.0"
          cpu: 4
          mem: 8192
          # A mirror can cut a download short (CI, 2026-11-04), so a failed
          # pkg_add is tried twice more
          prepare: /usr/sbin/pkg_add rust || { sleep 15; /usr/sbin/pkg_add rust; } || { sleep 30; /usr/sbin/pkg_add rust; }
          run: |
            cd "$GITHUB_WORKSPACE"
            export CARGO_TARGET_DIR="$HOME/proc-target"
            rustc --version
            want=""; [ "$GITHUB_EVENT_NAME" = push ] && want="proc ${GITHUB_REF_NAME#v}"
            sh scripts/bsd-build.sh proc-netbsd-x86_64 "$want"

      - name: Create tarball
        run: tar -czvf proc-${{ matrix.os }}-x86_64.tar.gz proc-${{ matrix.os }}-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proc-${{ matrix.os }}-x86_64
          path: |
            proc-${{ matrix.os }}-x86_64
            proc-${{ matrix.os }}-x86_64.tar.gz
          if-no-files-found: error

  # Every credential a release uses, checked before anything is published:
  # one that is invalid or expired stops the release here, and one that
  # expires within 30 days is a warning. Expiry dates are read live (GitHub
  # reports a token's in a response header), so none is stored anywhere.
  check-credentials:
    name: Check credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check each credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          NIXPKGS_FORK_TOKEN: ${{ secrets.NIXPKGS_FORK_TOKEN }}
          FREEBSD_BUGZILLA_API_KEY: ${{ secrets.FREEBSD_BUGZILLA_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          failed=0
          bad() { echo "::error::$1"; failed=1; }
          soon=$(( $(date +%s) + 30 * 86400 ))

          # GitHub tokens: valid, and when they expire (no header: never)
          for name in HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN WINGET_TOKEN NIXPKGS_FORK_TOKEN; do
            token=$(printenv "$name" || true)
            [ -n "$token" ] || { bad "$name is not set"; continue; }
            status=$(curl -sS -o /dev/null -D headers -w '%{http_code}' \
              -H "Authorization: Bearer $token" https://api.github.com/user)
            [ "$status" = 200 ] || { bad "$name is not accepted by GitHub (HTTP $status): renew it"; continue; }
            expires=$(sed -n 's/^github-authentication-token-expiration: *//Ip' headers | tr -d '\r')
            if [ -z "$expires" ]; then
              echo "$name: valid, does not expire"
            elif [ "$(date -d "$expires" +%s)" -lt "$soon" ]; then
              echo "::warning::$name expires $expires: renew it before then"
            else
              echo "$name: valid until $expires"
            fi
          done

          # The nixpkgs token also has to push to the fork's pull request branch
          if [ -n "$NIXPKGS_FORK_TOKEN" ]; then
            push=$(curl -sS -H "Authorization: Bearer $NIXPKGS_FORK_TOKEN" \
              https://api.github.com/repos/yazeed/nixpkgs | jq -r '.permissions.push // false')
            if [ "$push" = true ]; then
              echo "NIXPKGS_FORK_TOKEN: can push to yazeed/nixpkgs"
            else
              bad "NIXPKGS_FORK_TOKEN cannot push to yazeed/nixpkgs: give it write access to that repository"
            fi
          fi

          # FreeBSD's Bugzilla shows an account's email only to a signed-in
          # caller, so the key works and is the maintainer's when it shows it
          if [ -z "$FREEBSD_BUGZILLA_API_KEY" ]; then
            bad "FREEBSD_BUGZILLA_API_KEY is not set"
          else
            email=$(curl -sS "https://bugs.freebsd.org/bugzilla/rest/user?names=me@yazeed.com&include_fields=email&api_key=$FREEBSD_BUGZILLA_API_KEY" |
              jq -r '.users[0].email // .message // empty')
            if [ "$email" = me@yazeed.com ]; then
              echo "FREEBSD_BUGZILLA_API_KEY: valid, me@yazeed.com"
            else
              bad "FREEBSD_BUGZILLA_API_KEY is not accepted as me@yazeed.com by bugs.freebsd.org (${email:-no answer}): make a new key in Bugzilla's Preferences, API Keys"
            fi
          fi

          # Docker Hub: the token logs in, as the docker job's login does
          if printf '%s' "$DOCKERHUB_TOKEN" |
            docker login -u "$DOCKERHUB_USERNAME" --password-stdin > /dev/null 2>&1; then
            echo "DOCKERHUB_TOKEN: valid"
            docker logout > /dev/null
          else
            bad "DOCKERHUB_TOKEN does not log in to Docker Hub as $DOCKERHUB_USERNAME: renew it"
          fi

          # The apt repository's key: imports, and has not expired
          if printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import 2> /dev/null; then
            expiry=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec:/ { print $7; exit }')
            if [ -z "$expiry" ]; then
              echo "APT_SIGNING_KEY: valid, does not expire"
            elif [ "$expiry" -lt "$soon" ]; then
              echo "::warning::APT_SIGNING_KEY expires $(date -d "@$expiry" +%F): extend it before then"
            else
              echo "APT_SIGNING_KEY: valid until $(date -d "@$expiry" +%F)"
            fi
          else
            bad "APT_SIGNING_KEY does not import as an OpenPGP key"
          fi

          # COPR: the custom webhook address (it never expires). Each refusal
          # names what is wrong without printing the address
          webhook=https://copr.fedorainfracloud.org/webhooks/custom/
          case "$COPR_WEBHOOK" in
            *[[:space:]]*) bad "COPR_WEBHOOK has a space or a line break in it: set it to the address alone" ;;
            *'<'*|*'>'*) bad "COPR_WEBHOOK still has COPR's <PACKAGE_NAME> placeholder: put proc-cli in its place" ;;
            "$webhook"*/proc-cli/) echo "COPR_WEBHOOK: set" ;;
            "$webhook"*/proc-cli) bad "COPR_WEBHOOK needs the slash after proc-cli at the end" ;;
            "$webhook"*) bad "COPR_WEBHOOK names another package: it should end in /proc-cli/" ;;
            *) bad "COPR_WEBHOOK is not a COPR custom webhook address (it starts with $webhook)" ;;
          esac
          exit "$failed"

  create-release:
    name: Create Release
    needs: [build-release, package-linux, build-bsd, check-credentials]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # The PyPI wheels (package-pypi) are not release files, and may or may not be here yet
          find artifacts -path artifacts/pypi-wheels -prune -o -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          generate_release_notes: true
          make_latest: true

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          # Without pipefail, the `if` tests tee's exit status and a failed publish looks successful
          set -o pipefail
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Local version: $VERSION"

          if cargo publish --allow-dirty 2>&1 | tee /tmp/publish.log; then
            echo "Successfully published $VERSION to crates.io"
          else
            if grep -q "already exists" /tmp/publish.log; then
              echo "Version $VERSION already published to crates.io, skipping"
            else
              echo "Failed to publish"
              cat /tmp/publish.log
              exit 1
            fi
          fi

  publish-npm:
    name: Publish to npm
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer
      - name: Install npm 11
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Authenticates through the trusted publisher configured on npmjs.com
      # (yazeed/proc-cli, release.yml), using this job's id-token permission
      - name: Publish to npm
        working-directory: pkg/npm
        run: |
          # Without pipefail, the `if` tests tee's exit status and a failed publish looks successful
          set -o pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: $VERSION"

          if npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log; then
            echo "Successfully published $VERSION to npm"
          else
            if grep -q "already exists" /tmp/npm-publish.log || grep -q "previously published" /tmp/npm-publish.log; then
              echo "Version $VERSION already published to npm, skipping"
            else
              echo "Failed to publish"
              cat /tmp/npm-publish.log
              exit 1
            fi
          fi

  # Trusted publishing (OIDC, no token): pypi.org → proc-cli → Publishing has
  # GitHub, yazeed / proc-cli, release.yml, environment pypi (RELEASE.md,
  # "Required Secrets"). Re-running it after a partial upload skips the files
  # PyPI already has
  publish-pypi:
    name: Publish to PyPI
    needs: [create-release, test-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          skip-existing: true

  update-homebrew:
    name: Update Homebrew Tap
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-proc tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yazeed/homebrew-proc
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download checksums
        run: |
          gh release download ${{ github.ref_name }} --repo yazeed/proc-cli --pattern "checksums.txt" --output checksums.txt
          cat checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          DARWIN_ARM64=$(grep "proc-darwin-aarch64.tar.gz" checksums.txt | cut -d' ' -f1)
          DARWIN_X86=$(grep "proc-darwin-x86_64.tar.gz" checksums.txt | cut -d' ' -f1)
          LINUX_ARM64=$(grep "proc-linux-aarch64.tar.gz" checksums.txt | cut -d' ' -f1)
          LINUX_X86=$(grep "proc-linux-x86_64.tar.gz" checksums.txt | cut -d' ' -f1)

          cat > Formula/proc.rb << EOF
          class Proc < Formula
            desc "Semantic CLI tool for process management"
            homepage "https://proc-cli.com"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/yazeed/proc-cli/releases/download/v#{version}/proc-darwin-aarch64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              else
                url "https://github.com/yazeed/proc-cli/releases/download/v#{version}/proc-darwin-x86_64.tar.gz"
                sha256 "${DARWIN_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/yazeed/proc-cli/releases/download/v#{version}/proc-linux-aarch64.tar.gz"
                sha256 "${LINUX_ARM64}"
              else
                url "https://github.com/yazeed/proc-cli/releases/download/v#{version}/proc-linux-x86_64.tar.gz"
                sha256 "${LINUX_X86}"
              end
            end

            def install
              binary = Dir["proc-*"].first
              bin.install binary => "proc"
            end

            test do
              assert_match "proc", shell_output("#{bin}/proc --version")
            end
          end
          EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' Formula/proc.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/proc.rb
          git diff --staged --quiet || git commit -m "proc ${{ github.ref_name }}"
          git push

  update-scoop:
    name: Update Scoop Bucket
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoop-bucket-proc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yazeed/scoop-bucket-proc
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Download checksums
        run: |
          gh release download ${{ github.ref_name }} --repo yazeed/proc-cli --pattern "checksums.txt" --output checksums.txt
          cat checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update manifest
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          WINDOWS_HASH=$(grep "proc-windows-x86_64.exe.zip" checksums.txt | cut -d' ' -f1)

          cat > bucket/proc.json << 'EOF'
          {
              "version": "VERSION_PLACEHOLDER",
              "description": "Semantic CLI tool for process management. Target by port, PID, name or path.",
              "homepage": "https://proc-cli.com",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/yazeed/proc-cli/releases/download/vVERSION_PLACEHOLDER/proc-windows-x86_64.exe.zip",
                      "hash": "HASH_PLACEHOLDER"
                  }
              },
              "bin": [["proc-windows-x86_64.exe", "proc"]],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/yazeed/proc-cli/releases/download/v$version/proc-windows-x86_64.exe.zip"
                      }
                  }
              }
          }
          EOF

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" bucket/proc.json
          sed -i "s/HASH_PLACEHOLDER/${WINDOWS_HASH}/g" bucket/proc.json
          sed -i 's/^          //' bucket/proc.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/proc.json
          git diff --staged --quiet || git commit -m "proc ${{ github.ref_name }}"
          git push

  # Pages keeps the first deploy of a commit and ignores the next, and nearly
  # every push to main deploys (each change regenerates docs/changelog.md), so
  # the tagged commit was deployed before the release had its .deb files: 2.4.0
  # deployed it again here, and /apt stayed at 2.3.0. main's newest commit is
  # the one commit-package-files pushed, which nothing has deployed (a push
  # with this workflow's token starts no workflow), so pages.yml deploys that
  update-apt:
    name: Update the apt repository
    needs: [create-release, commit-package-files]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy main's newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "::error::main's newest commit is the tagged one, which Pages deployed before ${GITHUB_REF_NAME}'s packages existed (commit-package-files pushed nothing). After the next push to main, run: gh workflow run pages.yml --ref main"
            exit 1
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          run=
          for _ in $(seq 30); do
            sleep 10
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml \
              --event workflow_dispatch --commit "$head" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "::error::no Pages run started for $head in 5 minutes"; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      # Pages serves with a 10-minute cache that a query string does not get
      # past, so the check reads until the cached copy has expired
      - name: Check that /apt lists the release
        run: |
          version=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            url=https://proc-cli.com/apt/dists/stable/main/binary-$arch/Packages
            for _ in $(seq 30); do
              if curl -fsS "$url" | grep -qx "Version: $version"; then
                echo "$url lists $version"
                continue 2
              fi
              sleep 30
            done
            echo "::error::$url does not list $version after 15 minutes"
            exit 1
          done

  update-winget:
    name: Update winget
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # winget-releaser builds on the last version in winget-pkgs, so until
      # the first one is merged there is nothing to update yet
      - name: Check that yazeed.proc-cli is in winget-pkgs
        id: listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/microsoft/winget-pkgs/contents/manifests/y/yazeed/proc-cli > /dev/null 2>&1; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::yazeed.proc-cli is not in winget-pkgs yet, so winget is not updated for this release"
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      # Opens the pull request for the new version in microsoft/winget-pkgs,
      # from the yazeed/winget-pkgs fork (Komac finds it by that name). Only the
      # zip: the bare .exe would match the action's default pattern too.
      - if: steps.listed.outputs.listed == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main, 2026-10-07
        with:
          identifier: yazeed.proc-cli
          installers-regex: '\.exe\.zip$'
          release-tag: ${{ github.ref_name }}
          release-notes-url: https://github.com/yazeed/proc-cli/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  update-copr:
    name: Update COPR
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # COPR builds the release itself (pkg/copr/copr-build.sh, the package's
      # custom script), started by its custom webhook with the version; the
      # build is then followed on COPR's public API until it ends
      - name: Build the release in COPR
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          curl -fsS -X POST --data "$version" "$COPR_WEBHOOK"
          api='https://copr.fedorainfracloud.org/api_3/build/list?ownername=yazeed&projectname=proc-cli&packagename=proc-cli&limit=10'
          state=
          for _ in $(seq 1 90); do
            sleep 60
            state=$(curl -fsS "$api" | python3 -c '
          import json, sys
          version = sys.argv[1]
          for build in json.load(sys.stdin)["items"]:
              source = build.get("source_package") or {}
              if (source.get("version") or "").startswith(version + "-"):
                  print(build["state"], build["id"])
                  break
          ' "$version" || true)
            echo "COPR: ${state:-waiting for the build to start}"
            case "$state" in
              succeeded*) exit 0 ;;
              failed*|canceled*) echo "::error::COPR build ${state#* } $state: https://copr.fedorainfracloud.org/coprs/build/${state#* }"; exit 1 ;;
            esac
          done
          echo "::error::COPR did not finish the $version build in 90 minutes"
          exit 1

  # nixpkgs, until proc-cli is merged there: moves the pull request (from
  # yazeed/nixpkgs, branch proc-cli-init) to the release. update.sh learns both
  # hashes and builds proc with its tests in the sandbox; update-fork.sh amends
  # the "proc-cli: init" commit to that package.nix, force-pushes it with a
  # lease and retitles the pull request. A dry run does both for the version in
  # Cargo.toml, from a tarball of its checkout (that version has no download
  # before its tag), and pushes nothing. Once nixpkgs has proc-cli, its update
  # bot opens each update and this job leaves it alone
  update-nixpkgs:
    name: Update nixpkgs
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4

      - name: Move package.nix to the release (hashes, build, tests)
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            git archive --format=tar.gz --prefix="proc-cli-$version/" -o "$RUNNER_TEMP/source.tar.gz" HEAD
            export PROC_SOURCE="$RUNNER_TEMP/source.tar.gz"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sh pkg/nixpkgs/update.sh "$version"
          git diff -- pkg/nixpkgs/package.nix

      - name: Upload package.nix (for main)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixpkgs-package
          path: pkg/nixpkgs/package.nix
          if-no-files-found: error

      - name: Update the nixpkgs pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NIXPKGS_FORK_TOKEN: ${{ secrets.NIXPKGS_FORK_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sh pkg/nixpkgs/update-fork.sh "$VERSION" --push
          else
            sh pkg/nixpkgs/update-fork.sh "$VERSION"
          fi

  # The FreeBSD port: update-port.sh moves sysutils/proc-cli to the release in
  # a FreeBSD VM with a ports tree, builds, installs and checks it (check-plist,
  # stage-qa, portlint, proc --version) and writes the patch; file-patch.sh
  # attaches it to bug 300492 while the port is new, or opens an update bug
  # once it is committed, as the maintainer with maintainer-approval +. A dry
  # run does the same for the version in Cargo.toml, from a tarball of its
  # checkout (as update-nixpkgs), and files nothing
  update-freebsd:
    name: Update the FreeBSD port
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tarball sits in the workspace, which is copied into the VM
      - name: Version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PROC_SOURCE=" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            git archive --format=tar.gz --prefix="proc-cli-$version/" -o proc-source.tar.gz HEAD
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "PROC_SOURCE=$GITHUB_WORKSPACE/proc-source.tar.gz" >> "$GITHUB_ENV"
          fi

      # pkg's latest branch: the ports tree's main branch wants its Rust, and
      # quarterly's is older (2.3.0: 1.99.1 against 1.98.1). FreeBSD 15 names
      # its package repository FreeBSD-ports, so that is the one moved to
      # latest. A second repository with the same packages (the 14.x name,
      # FreeBSD) made pkg's self-upgrade loop until the job was killed, once a
      # new pkg was out (dry run, 2026-11-11)
      - name: Move the port to the release, build and check it
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          cpu: 4
          mem: 8192
          envs: VERSION PROC_SOURCE
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv" }\n' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg -vv | sed -n '/^Repositories:/,$p'
            pkg update -f
            pkg install -y git rust portlint
          run: |
            cd "$GITHUB_WORKSPACE"
            rustc --version
            sh pkg/freebsd/update-port.sh "$VERSION" freebsd-out

      - name: Upload the patch and the port's files (for main)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-port
          path: |
            freebsd-out/
            pkg/freebsd/
          if-no-files-found: error

      - name: File the patch
        env:
          FREEBSD_BUGZILLA_API_KEY: ${{ secrets.FREEBSD_BUGZILLA_API_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sh pkg/freebsd/file-patch.sh "$VERSION" freebsd-out --file
          else
            sh pkg/freebsd/file-patch.sh "$VERSION" freebsd-out
          fi

  # pkgsrc: update-package.sh moves sysutils/proc-cli from pkgsrc trunk to the
  # release, builds, installs and checks it in a NetBSD VM (pkglint, proc
  # --version) against the quarterly branch NetBSD's binary packages come
  # from, and writes the diff and the text for the gnats problem report, with
  # the form's fields in gnats-fields.json. The report is filed by hand (the
  # form has a check for people), from the run's pkgsrc-update artifact. A dry
  # run does the same for the version in Cargo.toml, from a tarball of its
  # checkout (as update-nixpkgs)
  update-pkgsrc:
    name: Update pkgsrc
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The quarter is where NetBSD 11.0's package repository points
      # (…/11.0 -> …/11.0_2026Q3)
      - name: Version and pkgsrc quarter
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PROC_SOURCE=" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            git archive --format=tar.gz --prefix="proc-cli-$version/" -o proc-source.tar.gz HEAD
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "PROC_SOURCE=$GITHUB_WORKSPACE/proc-source.tar.gz" >> "$GITHUB_ENV"
          fi
          location=$(curl -sSI https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/11.0 |
            sed -n 's/^location: *//Ip' | tr -d '\r')
          quarter=${location##*_}
          case "$quarter" in
            20[0-9][0-9]Q[1-4]) echo "QUARTER=$quarter" >> "$GITHUB_ENV" ;;
            *) echo "::error::could not read the pkgsrc quarter from '$location'"; exit 1 ;;
          esac

      - name: Move the package to the release, build and check it
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          release: "11.0"
          cpu: 4
          mem: 8192
          envs: VERSION QUARTER PROC_SOURCE
          # A mirror can cut a download short (CI, 2026-11-04), so a failed
          # pkg_add is tried twice more. digest is what make makesum checksums
          # with: without it, makesum writes a distinfo with no checksums
          prepare: /usr/sbin/pkg_add rust pkglint digest || { sleep 15; /usr/sbin/pkg_add rust pkglint digest; } || { sleep 30; /usr/sbin/pkg_add rust pkglint digest; }
          run: |
            cd "$GITHUB_WORKSPACE"
            rustc --version
            sh pkg/pkgsrc/update-package.sh "$VERSION" "$QUARTER" pkgsrc-out

      - name: The gnats form's fields
        run: |
          cd pkgsrc-out
          diff=proc-cli-$VERSION-pkgsrc.diff
          jq -n --rawfile description description --rawfile diff "$diff" \
            --arg synopsis "$(cat synopsis)" --arg environment "$(cat environment)" \
            --arg release "$(cut -d, -f1 environment)" --arg version "$VERSION" \
            '{email: "me@yazeed.com", originator: "Yazeed Al Oyoun", organization: "",
              synopsis: $synopsis, release: $release, environment: $environment,
              description: ($description | rtrimstr("\n")), howtorepeat: "",
              fix: ("The diff below updates sysutils/proc-cli to \($version); apply with patch -p1 from the pkgsrc root.\n\n" + $diff),
              category: "pkg", severity: "non-critical", priority: "low", class: "change-request"}' \
            > gnats-fields.json
          jq -r '.synopsis, .environment' gnats-fields.json

      - name: Upload the diff, the report's text and the package's files (for main)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkgsrc-update
          path: |
            pkgsrc-out/proc-cli-*-pkgsrc.diff
            pkgsrc-out/description
            pkgsrc-out/gnats-fields.json
            pkg/pkgsrc/
          if-no-files-found: error

  # The files the package jobs wrote go to main in one commit, so main holds
  # what was submitted for the release: pkg/nixpkgs/package.nix and the FreeBSD
  # port's and pkgsrc package's files. A job's files are taken only when that
  # job passed. They can't be in the release commit: their checksums are of
  # the tag's download, which holds that commit's ID. A dry run shows what it
  # would commit (with checksums of its tarball of the checkout) and commits
  # nothing
  commit-package-files:
    name: Commit the package files
    needs: [update-nixpkgs, update-freebsd, update-pkgsrc]
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download package.nix
        if: needs.update-nixpkgs.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nixpkgs-package
          path: ${{ runner.temp }}/nixpkgs

      - name: Download the FreeBSD port's files
        if: needs.update-freebsd.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd-port
          path: ${{ runner.temp }}/freebsd

      - name: Download the pkgsrc package's files
        if: needs.update-pkgsrc.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkgsrc-update
          path: ${{ runner.temp }}/pkgsrc

      # Only the files each job writes: the artifacts also hold the scripts,
      # which main keeps as they are
      - name: Commit them to main (a dry run shows the change)
        env:
          NIXPKGS: ${{ needs.update-nixpkgs.result }}
          FREEBSD: ${{ needs.update-freebsd.result }}
          PKGSRC: ${{ needs.update-pkgsrc.result }}
        run: |
          if [ "$NIXPKGS" = success ]; then
            cp "$RUNNER_TEMP/nixpkgs/package.nix" pkg/nixpkgs/
          else
            echo "::warning::update-nixpkgs ended $NIXPKGS: pkg/nixpkgs/ is left as it is"
          fi
          if [ "$FREEBSD" = success ]; then
            for f in Makefile Makefile.crates distinfo pkg-descr; do
              cp "$RUNNER_TEMP/freebsd/pkg/freebsd/$f" pkg/freebsd/
            done
          else
            echo "::warning::update-freebsd ended $FREEBSD: pkg/freebsd/ is left as it is"
          fi
          if [ "$PKGSRC" = success ]; then
            for f in DESCR Makefile PLIST cargo-depends.mk distinfo; do
              cp "$RUNNER_TEMP/pkgsrc/pkg/pkgsrc/$f" pkg/pkgsrc/
            done
          else
            echo "::warning::update-pkgsrc ended $PKGSRC: pkg/pkgsrc/ is left as it is"
          fi
          git diff --stat
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            git diff
            echo "A dry run commits nothing: a tag's run commits the files above to main"
            exit 0
          fi
          if git diff --quiet; then
            echo "The package files on main are already the release's"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all -m "chore: package files for ${GITHUB_REF_NAME}" \
            -m "The nixpkgs, FreeBSD and pkgsrc files the release's jobs wrote for ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})."
          # main can move while the release runs
          for _ in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              git log --oneline -1
              exit 0
            fi
            git pull --quiet --rebase origin main
          done
          echo "::error::could not push the package files to main; they are in this run's artifacts"
          exit 1
