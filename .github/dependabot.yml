# Version updates for what the workflows and the Docker image are pinned to.
# Every third-party action is pinned to a commit SHA with its version in a
# comment, and both Docker base images to a digest; Dependabot moves the pins
# (SHA and comment together) by pull request. Nothing changes until a pull
# request is merged. Crate updates stay manual (cargo update in RELEASE.md's
# checks; cargo audit runs in CI).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Minor and patch updates come as one pull request a week; each major
    # update comes on its own, since a new major can change what a job does.
    # A major update to an action release.yml uses gets the release
    # workflow's dry run (RELEASE.md, step 1) on its branch before it is merged
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
    ignore:
      # Stays on its pinned commit until the first automated winget update
      # succeeds (RELEASE.md, step 6), then moves to a release
      - dependency-name: "vedantmgoyal9/winget-releaser"
      # 7.0 stopped exporting the placeholder NODE_AUTH_TOKEN that the
      # .npmrc registry-url writes refers to, and the npm job's trusted
      # publishing (OIDC, no token) was built and tested on that setup; 6.x
      # runs on Node 24 too. Moved by hand once 7.x passes a release's dry run
      - dependency-name: "actions/setup-node"
        versions: [">=7"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
