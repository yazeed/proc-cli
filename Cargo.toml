[package]
name = "proc-cli"
version = "2.4.0"
edition = "2021"
# sysinfo 0.38 needs 1.88
rust-version = "1.88"
authors = ["Yazeed Al Oyoun <me@yazeed.com>"]
description = "Semantic CLI tool for process management. Target by port, PID, name or path."
repository = "https://github.com/yazeed/proc-cli"
homepage = "https://proc-cli.com"
documentation = "https://docs.rs/proc-cli"
license = "MIT"
keywords = ["kill", "lsof", "port", "process", "eaddrinuse"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "proc"
path = "src/main.rs"

[dependencies]
# CLI Framework
clap = { version = "4.5", features = ["derive", "cargo", "unicode", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"

# Output & Formatting
colored = "3.1"
comfy-table = "7.2"
crossterm = "0.29"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cross-platform process/system info
sysinfo = "0.38"

# User Interaction
dialoguer = "0.12"

# Regex (for pattern matching)
regex = "1.11"

# Error handling
thiserror = "2.0"

# Unix-specific (for signals)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "user"] }
libc = "0.2"
# Already in the tree through crossterm; used to restore the terminal when a
# signal ends watch or a prompt
signal-hook = "0.3"

# Windows: Ctrl-C, Ctrl-Break and a closing console, for the same job
[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"

[dev-dependencies]
tempfile = "3.14"
portable-pty = "0.9.0"
assert_cmd = "2.0"
predicates = "3.1"
cargo-husky = { version = "1", features = ["precommit-hook", "run-cargo-fmt"], default-features = false }

# cargo-binstall support (download pre-built binaries instead of compiling)
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/proc-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/proc-windows-x86_64.exe.zip"
bin-dir = "proc-windows-x86_64.exe"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/proc-darwin-x86_64.tar.gz"
bin-dir = "proc-darwin-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/proc-darwin-aarch64.tar.gz"
bin-dir = "proc-darwin-aarch64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/proc-linux-x86_64.tar.gz"
bin-dir = "proc-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/proc-linux-aarch64.tar.gz"
bin-dir = "proc-linux-aarch64"

# The Linux binaries are static musl builds, so musl hosts (Alpine) use the same files
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/proc-linux-x86_64.tar.gz"
bin-dir = "proc-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/proc-linux-aarch64.tar.gz"
bin-dir = "proc-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-unknown-freebsd]
pkg-url = "{ repo }/releases/download/v{ version }/proc-freebsd-x86_64.tar.gz"
bin-dir = "proc-freebsd-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-netbsd]
pkg-url = "{ repo }/releases/download/v{ version }/proc-netbsd-x86_64.tar.gz"
bin-dir = "proc-netbsd-x86_64"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

# cargo-llvm-cov builds with cfg(coverage)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
